<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Song Sorter</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/index.js"></script>
  <style>
    :root {
      --bg-1: #121212;
      --fg-1: #ffffff;
      --fg-2: #b3b3b3;
      --brand: #1DB954;
      --brand-hover: #1ed760;
      --error: #e22134;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --r-md: 8px;
      --r-pill: 500px;
      --t-quick: 0.1s;
      --t-base: 0.15s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-1);
      color: var(--fg-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo svg { width: 48px; height: 48px; }

    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }

    p.tagline {
      color: var(--fg-2);
      font-size: 1rem;
      text-align: center;
      max-width: 380px;
      line-height: 1.5;
    }

    .btn-spotify {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--brand);
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: var(--r-pill);
      text-decoration: none;
      transition: background var(--t-base), transform var(--t-quick);
    }

    .btn-spotify:hover { background: var(--brand-hover); transform: scale(1.03); }

    .error-banner {
      background: var(--error);
      color: var(--fg-1);
      padding: 10px 20px;
      border-radius: var(--r-md);
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo">
    <!-- Spotify-green music note icon -->
    <svg viewBox="0 0 24 24" fill="#1DB954" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/>
    </svg>
    <h1>Song Sorter</h1>
  </div>

  <p class="tagline">
    Sort your Spotify playlists so the most recently added songs always play first —
    without changing the original "Added" dates.
  </p>

  <div class="error-banner" id="errorBanner"></div>

  <a href="/auth/login" class="btn-spotify">
    <!-- Spotify logo -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </svg>
    Login with Spotify
  </a>
</body>
</html>
