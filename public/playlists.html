<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Playlists — Spotify Song Sorter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #000;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #282828;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .header-brand svg { width: 28px; height: 28px; }

    .header-filters {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-tab {
      background: transparent;
      border: 1px solid #535353;
      color: #b3b3b3;
      padding: 5px 14px;
      border-radius: 500px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .filter-tab:hover { border-color: #fff; color: #fff; }

    .filter-tab.active {
      background: #fff;
      border-color: #fff;
      color: #000;
    }

    .filter-tab .tab-count {
      display: inline-block;
      margin-left: 5px;
      background: rgba(0,0,0,0.2);
      border-radius: 500px;
      padding: 0 6px;
      font-size: 0.75rem;
      line-height: 1.5;
    }

    .filter-tab.active .tab-count {
      background: rgba(0,0,0,0.15);
    }

    .filter-tab[data-filter="needs-resorting"].active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #000;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.9rem;
      color: #b3b3b3;
      flex-shrink: 0;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-wrap svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: #b3b3b3;
      pointer-events: none;
    }

    #searchInput {
      background: #282828;
      border: 1px solid #535353;
      border-radius: 500px;
      color: #fff;
      font-size: 0.85rem;
      padding: 7px 14px 7px 32px;
      width: 220px;
      outline: none;
      transition: border-color 0.15s, width 0.2s;
    }

    #searchInput::placeholder { color: #737373; }
    #searchInput:focus { border-color: #fff; width: 280px; }

    .btn-logout {
      background: transparent;
      border: 1px solid #535353;
      color: #fff;
      padding: 6px 16px;
      border-radius: 500px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.15s;
    }
    .btn-logout:hover { border-color: #fff; }

    /* ── Main ── */
    main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 120px; }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: #b3b3b3;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 20px;
      border-radius: 500px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-ghost {
      background: transparent;
      border: 1px solid #535353;
      color: #fff;
    }
    .btn-ghost:hover { border-color: #fff; }

    .btn-primary {
      background: #1DB954;
      color: #000;
    }
    .btn-primary:hover:not(:disabled) { background: #1ed760; }
    .btn-primary:disabled {
      background: #535353;
      color: #888;
      cursor: not-allowed;
    }

    .selection-count {
      color: #b3b3b3;
      font-size: 0.85rem;
      margin-left: auto;
    }

    /* ── Playlist grid ── */
    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .playlist-card {
      background: #181818;
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
      user-select: none;
    }

    .playlist-card:hover { background: #282828; }

    .playlist-card.selected {
      background: #1a3a27;
      outline: 2px solid #1DB954;
    }

    .playlist-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
      background: #333;
    }

    .playlist-card .no-image {
      width: 100%;
      aspect-ratio: 1;
      background: #282828;
      border-radius: 4px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #535353;
      font-size: 2rem;
    }

    .playlist-name {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-meta {
      color: #b3b3b3;
      font-size: 0.78rem;
      margin-top: 4px;
    }

    .check-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 22px;
      height: 22px;
      background: #1DB954;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .playlist-card.selected .check-badge { display: flex; }

    .check-badge svg { width: 13px; height: 13px; }

    .modified-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 1rem;
      display: none;
      line-height: 1;
    }

    .playlist-card.modified .modified-badge { display: block; }
    .playlist-card.modified.selected .modified-badge { display: none; }

    .sorted-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 22px;
      height: 22px;
      background: #1DB954;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .playlist-card.sorted .sorted-badge { display: flex; }
    .playlist-card.sorted { opacity: 0.75; }
    .playlist-card.sorted .sorted-badge svg { width: 13px; height: 13px; }

    /* ── Loading / empty states ── */
    .state-message {
      text-align: center;
      padding: 64px 0;
      color: #b3b3b3;
      font-size: 0.95rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: #1DB954;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bottom action bar ── */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, #121212 40%);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .btn-sort {
      padding: 14px 40px;
      font-size: 1rem;
      border-radius: 500px;
    }

    /* ── Progress modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: #282828;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 1.2rem; margin-bottom: 20px; }

    .playlist-progress-item {
      margin-bottom: 20px;
    }

    .playlist-progress-item .name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .playlist-progress-item .status-text {
      font-size: 0.8rem;
      color: #b3b3b3;
      margin-bottom: 6px;
      min-height: 1em;
    }

    .progress-bar-bg {
      background: #3e3e3e;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #1DB954;
      border-radius: 4px;
      width: 0%;
      transition: width 0.2s;
    }

    .status-icon { font-size: 1rem; }

    .modal-footer {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    /* ── Re-sort prompt dialog ── */
    .prompt-dialog {
      background: #1e1e1e;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
    }

    .prompt-dialog h2 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-dialog .prompt-body {
      color: #b3b3b3;
      font-size: 0.88rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .prompt-dialog .prompt-list {
      list-style: none;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .prompt-dialog .prompt-list li {
      font-size: 0.85rem;
      padding: 6px 10px;
      background: #282828;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-dialog .prompt-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-warning {
      background: #f59e0b;
      color: #000;
    }

    .btn-warning:hover { background: #fbbf24; }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <svg viewBox="0 0 24 24" fill="#1DB954">
        <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/>
      </svg>
      Song Sorter
    </div>
    <div class="header-filters">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">All <span class="tab-count" id="count-all"></span></button>
      <button class="filter-tab" data-filter="unsorted" onclick="setFilter('unsorted')">Unsorted <span class="tab-count" id="count-unsorted"></span></button>
      <button class="filter-tab" data-filter="sorted" onclick="setFilter('sorted')">Sorted <span class="tab-count" id="count-sorted"></span></button>
      <button class="filter-tab" data-filter="needs-resorting" onclick="setFilter('needs-resorting')">Needs re-sorting <span class="tab-count" id="count-needs-resorting"></span></button>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Search playlists…" oninput="filterPlaylists(this.value)" />
      </div>
      <span id="displayName"></span>
      <button class="btn-logout" onclick="logout()">Log out</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Your Playlists</h1>
    <p class="page-subtitle">Select playlists to sort by date added (newest first).</p>

    <div class="controls">
      <button class="btn btn-ghost" onclick="selectAll()">Select All</button>
      <button class="btn btn-ghost" onclick="deselectAll()">Deselect All</button>
      <span class="selection-count" id="selectionCount">0 selected</span>
    </div>

    <div id="playlistGrid" class="playlist-grid">
      <div class="state-message">
        <div class="spinner"></div>
        Loading your playlists…
      </div>
    </div>
  </main>

  <div class="action-bar">
    <button class="btn btn-primary btn-sort" id="sortBtn" disabled onclick="startSort()">
      Sort Selected Playlists
    </button>
  </div>

  <!-- Re-sort prompt -->
  <div class="modal-overlay" id="resortOverlay">
    <div class="prompt-dialog">
      <h2>⚠️ Playlists need re-sorting</h2>
      <p class="prompt-body">The following playlists have changed since they were last sorted.</p>
      <ul class="prompt-list" id="resortList"></ul>
      <div class="prompt-footer">
        <button class="btn btn-ghost" onclick="dismissResort()">Not now</button>
        <button class="btn btn-warning" onclick="confirmResort()">Sort now</button>
      </div>
    </div>
  </div>

  <!-- Progress modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Sorting Playlists</h2>
      <div id="progressList"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="doneBtn" style="display:none" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
